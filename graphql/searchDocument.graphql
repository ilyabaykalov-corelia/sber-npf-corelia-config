query searchDocument($offset: Int, $limit: Int, $cond: String, $sort: [_SortCriterionSpecification!]) { searchDocument(offset: $offset, limit: $limit, cond: $cond, sort: $sort) { elems { id documentId documentType { id name } createdBy createdAt version changeToken kidOps { id contractNumber contractDate signingYear lastName firstName middleName snils status } pdsContract { id contractDate contractNumber snils status } } count } }
