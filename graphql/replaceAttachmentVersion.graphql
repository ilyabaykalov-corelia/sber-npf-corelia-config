mutation replaceAttachmentVersion($currentAttachmentId: ID!, $input: _CreateAttachmentInput!) { packet { updateAttachment(input: { id: $currentAttachmentId, current: false }) { id attachmentId logicalAttachmentId documentId version current } createAttachment(input: $input) { id attachmentId logicalAttachmentId documentId fileName contentType size storageReference version current uploadedAt } } }
